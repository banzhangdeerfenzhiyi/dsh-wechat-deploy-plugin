# dsh-wechat-deploy-plugin — bundle patch
#
# 推荐安装方式：`node tools/install.mjs`（会把带路径的 insert 写进每个 profile patch）。
#
# 也可以作为 DSH bundle 安装：
#   dsh plugin --profile desktop add https://github.com/banzhangdeerfenzhiyi/dsh-wechat-deploy-plugin
# 或在 DSH 的「添加插件」里填 GitHub 仓库地址（不是 npm 包名）。
#
# workspace 留空 = 自动探测：WECHATAGENT_WORKSPACE → ~/Documents/data/workspace
# → <DSH_HOME>/wechatagent。其余配置大多来自工作区的 config/wechatagent.json。
- insert:
    - id: dsh-wechat-deploy
      name: 'dsh-wechat-deploy-plugin'
      config:
        enabled: true
        promptEnabled: true
        workspace: ''
        hookUrl: 'http://127.0.0.1:30001'
        expectedVersion: '4.1.10.27'
        powershell: 'powershell.exe'
